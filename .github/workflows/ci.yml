name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Require real lockfile
        shell: bash
        run: test -s uv.lock || (echo 'Commit a genuine uv.lock before CI can pass' >&2; exit 1)
      - name: Install locked dependencies
        run: uv sync --locked --group dev --extra providers --extra playground
      - name: Quality checks
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy src
      - name: Documentation and release metadata
        run: |
          uv run --locked python scripts/validate_patterns.py
          uv run --locked python scripts/generate_catalog.py --check
          uv run --locked python scripts/generate_api_reference.py --check
          uv run --locked python scripts/release_check.py --strict
      - name: Offline secret and filename checks
        run: |
          uv run --locked python scripts/check_no_secrets.py
          uv run --locked python scripts/security_static_check.py
      - name: Test
        run: uv run --offline --locked pytest -q
      - name: All offline handbook patterns
        run: uv run --offline --locked python scripts/run_all_patterns.py
      - name: All offline case studies
        run: uv run --offline --locked python scripts/run_all_case_studies.py
      - name: Reproduce synthetic benchmarks
        run: uv run --offline --locked python scripts/run_benchmarks.py
      - name: Wheel and source distribution
        run: uv build
