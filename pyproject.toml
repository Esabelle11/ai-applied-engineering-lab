[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applied-ai-engineering-lab"
version = "0.8.0"
description = "An executable handbook of reusable Applied AI engineering patterns"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["applied-ai", "llm", "engineering-patterns", "handbook"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
openai = ["httpx>=0.27,<1"]
providers = ["httpx>=0.27,<1"]
openrouter = ["httpx>=0.27,<1"]
anthropic = ["httpx>=0.27,<1"]
google = ["httpx>=0.27,<1"]
ollama = ["httpx>=0.27,<1"]
groq = ["httpx>=0.27,<1"]
media = [
  "accelerate>=1,<2",
  "diffusers>=0.36,<1",
  "Pillow>=13,<14",
  "safetensors>=0.5,<1",
  "torch>=2.6,<3",
  "transformers>=4.48,<6",
]
local-kernel = ["ipykernel>=6,<7", "jupyter-client>=8,<9"]
jev = ["typesafe-sdk>=0.7,<1"]
agent-frameworks = ["langchain>=1,<2", "langgraph>=1,<2"]
playground = [
  "fastapi>=0.115,<1",
  "httpx2>=2.13,<3",
  "uvicorn>=0.30,<1",
  "pyyaml>=6,<7",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "httpx>=0.27,<1",
  "mypy>=1.15,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pyyaml>=6,<7",
  "ruff>=0.13,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["applied_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unused_configs = true
